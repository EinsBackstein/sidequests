name: ctf-format

on:
  push:
    paths:
      - "ctf-format/**"
      - ".github/workflows/ctf-format.yml"
  pull_request:
    paths:
      - "ctf-format/**"
      - ".github/workflows/ctf-format.yml"

defaults:
  run:
    working-directory: ctf-format

jobs:
  test:
    # x86-64 and aarch64. Rule G11 requires the same generator module to produce
    # the same output root on both, which is the codegen-level half of the
    # determinism guarantee the two in-process runs cannot reach.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      # The query macros read `.sqlx/`, not a live server. These runners have no
      # Postgres; the `database` job below is what revalidates against one.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ctf-format
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Issues #49/#50: the committed corpus is not just data on disk. Running the
      # runner makes every golden, hostile, and future-file vector an explicit,
      # separately named failure instead of a file nobody executes. The crate's own
      # tests already assert the corpus index is in sync; this prints the per-vector
      # PASS/FAIL lines CI logs are read for.
      - name: Conformance corpus (golden, hostile, future)
        run: cargo run -p ctf-conformance
      # Issue #51: the fuzz oracle runs on the pinned stable toolchain, through the
      # mirror in `tests/fuzzmirror.rs` plus the mutation sweep. `cargo test
      # --workspace` already includes both; this step makes the fuzz lane an
      # explicit, separately named failure so a regression cannot hide inside the
      # workspace result. The committed corpus under `fuzz/corpus/` is the seed set
      # the mirror actually executes.
      - name: Fuzz oracle (pinned toolchain)
        run: cargo test -p ctf-format --test fuzzmirror --test mutation
      # The mirror keeps each target body compiling, but it cannot catch a target
      # that no longer *builds* as a crate (a stale signature, a workspace entry).
      # Checking the real manifests on stable is what keeps the crate buildable
      # between interactive nightly runs; `fuzz/` is deliberately excluded from the
      # root workspace, so a stale target does not fail `cargo test --workspace`.
      - name: Fuzz targets build as committed
        run: cargo check --manifest-path fuzz/Cargo.toml
      - name: The committed fuzz corpus is present and non-empty
        run: |
          set -eu
          dirs=$(find fuzz/corpus -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          seeds=$(find fuzz/corpus -type f | wc -l | tr -d ' ')
          echo "corpus directories: $dirs, seed files: $seeds"
          test "$dirs" -ge 5
          test "$seeds" -ge 6
      - name: The Rust guest SDK still builds to wasm
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release --target wasm32-unknown-unknown
        working-directory: ctf-format/sdk/sample-generator

  database:
    # The ingest and serving tests need a real Postgres: they execute the
    # migration and every statement in `db.rs`/`ingest.rs`, including the
    # default-deny serving query and the entitlement upsert. The `test` matrix
    # above stays database-free (the DB tests skip without the variable), so
    # macOS coverage and runtime are unchanged.
    name: Postgres ingest, migrations, serving rule
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ctf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ctf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # With `DATABASE_URL` set and no `SQLX_OFFLINE`, the query macros compile
      # against this Postgres rather than the committed `.sqlx/` cache, so a stale
      # cache fails here. That needs the schema to exist *before* the crate is
      # compiled, which is what the migration step below does. The tests
      # themselves use `CTF_TEST_DATABASE_URL` and each create their own schema.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ctf
      CTF_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ctf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ctf-format
          key: postgres
      - name: Migrate the compile-time schema
        # `sqlx::migrate!` embeds the same files, but it only runs once the crate
        # has compiled, and the macros need the tables first. Applying the SQL
        # directly is enough: the tests create their own schemas.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f crates/ctf-tui/migrations/0001_initial.sql
      - name: Migrations, ingest pipeline, serving rule
        run: cargo test -p ctf-tui --test db
      - name: Admin TUI state machine and rendering
        run: cargo test -p ctf-tui --test ui
