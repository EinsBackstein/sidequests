name: ctf-format

on:
  push:
    paths:
      - "ctf-format/**"
  pull_request:
    paths:
      - "ctf-format/**"

defaults:
  run:
    working-directory: ctf-format

jobs:
  test:
    # x86-64 and aarch64. Rule G11 requires the same generator module to produce
    # the same output root on both, which is the codegen-level half of the
    # determinism guarantee the two in-process runs cannot reach.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ctf-format
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: The Rust guest SDK still builds to wasm
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release --target wasm32-unknown-unknown
        working-directory: ctf-format/sdk/sample-generator
