[workspace]
members = ["crates/ctf-format", "crates/ctf-cli", "crates/ctf-generator", "crates/ctf-conformance"]
# Guest SDKs target `wasm32-unknown-unknown` and export a C ABI, so they are
# deliberately outside the workspace: their lints, profiles, and target differ
# from the host crates'. They are built on demand (see `sdk/*/README.md`).
exclude = ["sdk/rust", "sdk/sample-generator", "sdk/reference/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"

[workspace.lints.rust]
# `deny`, not `forbid`: the core crates never write `unsafe`, but `ctf inspect`
# memory-maps the bundle (ticket 80) and `memmap2`'s only entry point is an
# `unsafe fn`. `deny` keeps every accidental `unsafe` an error while letting the
# CLI opt in at one audited call site; `forbid` could not be overridden at all.
unsafe_code = "deny"

[workspace.lints.clippy]
indexing_slicing = "warn"
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
