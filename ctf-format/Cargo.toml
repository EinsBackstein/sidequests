[workspace]
members = ["crates/ctf-format", "crates/ctf-cli", "crates/ctf-generator"]
# Guest SDKs target `wasm32-unknown-unknown` and export a C ABI, so they are
# deliberately outside the workspace: their lints, profiles, and target differ
# from the host crates'. They are built on demand (see `sdk/*/README.md`).
exclude = ["sdk/rust", "sdk/sample-generator"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
indexing_slicing = "warn"
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
