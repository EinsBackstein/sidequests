[package]
name = "ctf-cli"
version = "0.8.0"
description = "The `ctf` command-line tool for the .ctf challenge transport format"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "ctf"
path = "src/main.rs"

# `clap` arrived with the command set that justifies it (design §10): several
# subcommands with flags, discoverable help, and generated shell completions.
# It is configured to exit 1 on usage errors so the explicit exit 2 that
# `inspect --verify` uses to mean "intact but not authentic" stays unambiguous.
[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
ctf-format = { path = "../ctf-format" }

[lints]
workspace = true
