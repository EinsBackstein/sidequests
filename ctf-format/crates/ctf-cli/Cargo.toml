[package]
name = "ctf-cli"
version = "0.13.8"
description = "The `ctf` command-line tool for the .ctf challenge transport format"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "ctf"
path = "src/main.rs"

# `clap` arrived with the command set that justifies it (design §10): several
# subcommands with flags, discoverable help, and generated shell completions.
# It is configured to exit 1 on usage errors so the explicit exit 2 that
# `inspect --verify` uses to mean "intact but not authentic" stays unambiguous.
[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
ctf-format = { path = "../ctf-format" }
# `ctf run` (ticket 28, design §10) runs the offline solvability gate, which needs
# the deterministic WASM host. The container library stays free of Wasmtime; only
# the CLI and the future orchestrator link it.
ctf-generator = { path = "../ctf-generator" }
# `ctf inspect` maps the bundle instead of reading it into a `Vec` (ticket 80),
# so a multi-GB inline bundle is inspected without a whole-file allocation. This
# is the one crate that opts out of the workspace's `unsafe_code` denial, at a
# single call site in `open_mapped`.
memmap2 = "0.9"
# `ctf verify` names the whole bundle file by its BLAKE3 digest (ticket 64), so a
# job can pin the exact bytes an ingest verdict is about. The container library
# already links BLAKE3; this makes the digest a first-class CLI input rather than
# a value reconstructed from a section root.
blake3 = "1.8"

[dev-dependencies]
# Builds the tiny generator/solver modules the gate tests run, in the same way
# `ctf-generator`'s tests do.
wat = "1"
# Parses the `ctf/ingest-verification/v1` artifact in tests, so "the JSON parses"
# is checked by a parser rather than by substring matching.
serde_json = "1"

[lints]
workspace = true
