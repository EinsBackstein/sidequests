[package]
name = "ctf-conformance"
version = "0.11.0"
description = "Conformance vector runner for the .ctf format: golden bundles and hostile inputs"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "ctf-conformance"
path = "src/main.rs"

# Only the reference implementation. The runner deliberately has no crypto
# dependency of its own: it exercises `ctf-format`'s public API, so a vector can
# never pass by re-implementing a rule the reference gets wrong.
[dependencies]
ctf-format = { path = "../ctf-format" }

[lints]
workspace = true
